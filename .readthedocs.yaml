#
# Read the Docs configuration.
#
# For now the site is README.md rendered to a single page by
# scripts/rtd-readme-page, with the demo GIFs next to it. A full documentation
# site will replace these build commands.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # Every command runs in a new process that does not see the files an
  # earlier command left in /tmp; only the checkout, the output directory and
  # the installed packages persist.
  commands:
    # Python-Markdown, pinned by version and hash, read from standard input.
    - >-
      printf '%s\n'
      'markdown==3.10.3 --hash=sha256:fa6c92a00a4a3c98b22728c64a935ae1928250ae65058a6ded814d2cc29a4cea'
      | python -m pip install --no-cache-dir --require-hashes --only-binary=:all:
      -r /dev/stdin
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    # The images the README embeds, when the checkout has any.
    - if [ -d docs ]; then cp -R docs "$READTHEDOCS_OUTPUT/html/docs"; fi
    - python scripts/rtd-readme-page
