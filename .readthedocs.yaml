#
# Read the Docs configuration.
#
# For now the site is README.md rendered to a single page by
# scripts/rtd-readme-page, with the demo GIFs next to it. A full documentation
# site will replace this build command.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # Read the Docs does not run build commands through a regular shell: pipes
  # and backslash escapes do not survive, and every command starts in a new
  # process. The script therefore does all the work, including the pinned
  # Python-Markdown installation.
  commands:
    - python scripts/rtd-readme-page
