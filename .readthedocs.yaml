#
# Read the Docs build of the documentation site in docs/ (Sphinx with the Furo
# theme, warnings are errors). The same build runs in a container as
# "scripts/build-in-container.sh docs", and CI runs that on every pull request;
# docs/project/documentation.md describes both.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  # Clean URLs such as /guide/update/ instead of /guide/update.html.
  builder: dirhtml
  fail_on_warning: true

python:
  install:
    # Exact versions with hashes, generated from docs/requirements.in.
    - requirements: docs/requirements.txt
