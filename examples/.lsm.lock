#
# Example .lsm.lock that belongs to examples/.gitmodules, as scripts/demo.sh
# leaves it. lazysubmodules update and add write one section per managed
# submodule: mode, the resolved ref and the full commit. The ref is the tag
# a pattern selected (kernel, fresh, sdk), the tag, the branch, or the full
# commit in commit mode. Entries follow the order in which they were first
# written; legacy came last. See examples/README.md.

