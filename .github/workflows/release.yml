#
# Release: a pushed version tag is tested and published by GoReleaser through
# scripts/build-in-container.sh (see CONTRIBUTING.md). The build image is
# restored from the cache that CI on main writes, or built when it is missing.
#
# Only a signed tag is released: the tag must be annotated, point at the
# checked-out commit and carry a good OpenPGP signature from one of the public
# keys in the repository variable RELEASE_TAG_KEYS (ASCII-armored). A
# repository variable can only be changed in the repository settings, unlike
# a key file in the tagged tree, which whoever pushes the tag controls.
#
# Publishing to the AUR is optional: without the AUR_KEY secret, GoReleaser
# skips it.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # cosign keyless signing with the GitHub OIDC token
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the changelog
          persist-credentials: false

      # The checkout fetches all tags as they are, so an annotated tag keeps
      # its signature.
      - name: Verify tag signature
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_TAG_KEYS: ${{ vars.RELEASE_TAG_KEYS }}
        run: |
          ref="refs/tags/${TAG}"
          if [[ -z "$RELEASE_TAG_KEYS" ]]; then
            echo "::error::the repository variable RELEASE_TAG_KEYS (OpenPGP public keys allowed to sign release tags) is not set"
            exit 1
          fi
          type="$(git cat-file -t "$ref" 2>/dev/null)" || type="missing"
          if [[ "$type" != "tag" ]]; then
            echo "::error::${TAG} is not an annotated tag (${type}); release tags must be signed (git tag -s)"
            exit 1
          fi
          if [[ "$(git rev-parse --verify "${ref}^{commit}")" != "$(git rev-parse --verify HEAD)" ]]; then
            echo "::error::${TAG} does not point at the checked-out commit"
            exit 1
          fi
          # A keyring with only the allowed keys: any good signature by one
          # of them is accepted, any other signature is rejected.
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          if ! printf '%s\n' "$RELEASE_TAG_KEYS" | gpg --batch --quiet --import; then
            echo "::error::RELEASE_TAG_KEYS holds no valid OpenPGP public key"
            exit 1
          fi
          if ! git verify-tag "$ref"; then
            echo "::error::${TAG} has no good signature from a key in RELEASE_TAG_KEYS"
            exit 1
          fi

      - name: Resolve build image
        id: image
        run: |
          ref="$(scripts/build-in-container.sh image-tag)"
          echo "ref=${ref}" >>"$GITHUB_OUTPUT"
          echo "archive=${RUNNER_TEMP}/build-image.tar" >>"$GITHUB_OUTPUT"

      - name: Restore build image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.image.outputs.archive }}
          key: build-image-${{ steps.image.outputs.ref }}

      - name: image (load)
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          IMAGE_ARCHIVE: ${{ steps.image.outputs.archive }}
        run: scripts/build-in-container.sh image-load

      - name: image (build)
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-in-container.sh image

      - name: test
        run: scripts/build-in-container.sh test

      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: scripts/build-in-container.sh release
